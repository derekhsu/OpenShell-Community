name: Build OpenClaw Image for Docker Hub

on:
  push:
    branches: [main]
    paths:
      - "sandboxes/openclaw/**"
      - ".github/workflows/build-openclaw.yml"
  pull_request:
    branches: [main]
    paths:
      - "sandboxes/openclaw/**"
      - ".github/workflows/build-openclaw.yml"
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: 'OpenClaw version to install (default: 2026.4.14)'
        required: false
        default: '2026.4.14'

env:
  REGISTRY: docker.io
  IMAGE_NAME: derekhsu/openshell-openclaw

jobs:
  build-openclaw:
    name: Build and Push OpenClaw Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.openclaw_version || '2026.4.14' }},enable={{is_default_branch}}
            type=sha,prefix=,enable=true

      - name: Build and push OpenClaw image
        uses: docker/build-push-action@v6
        with:
          context: sandboxes/openclaw
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=ghcr.io/derekhsu/openshell-community/sandboxes/base:latest
            OPENCLAW_VERSION=${{ github.event.inputs.openclaw_version || '2026.4.14' }}
          cache-from: type=gha,scope=openclaw
          cache-to: type=gha,mode=max,scope=openclaw
